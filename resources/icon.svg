<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8d5cf0"/><stop offset=".55" stop-color="#4b2e9a"/><stop offset="1" stop-color="#231a3d"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".42" r=".55">
      <stop offset="0" stop-color="#ffd76a" stop-opacity=".45"/><stop offset=".6" stop-color="#ffb020" stop-opacity=".08"/><stop offset="1" stop-color="#ffb020" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="q" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset=".45" stop-color="#fff3b8"/><stop offset="1" stop-color="#ffd21f"/>
    </linearGradient>
    <radialGradient id="shine" cx=".34" cy=".3" r=".5"><stop offset="0" stop-color="#fff" stop-opacity=".75"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <radialGradient id="shade" cx=".5" cy=".5" r=".5"><stop offset=".6" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".25"/></radialGradient>
    <filter id="ds" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#12082e" flood-opacity=".55"/></filter>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/><rect width="512" height="512" fill="url(#glow)"/>
  <g id="fg" transform="translate(256 256) scale(1) translate(-256 -256)">
    <g filter="url(#ds)">
      <!-- a crooked question mark -->
      <g transform="rotate(-12 256 250)">
        <path d="M178 186 C178 118 230 88 276 90 C338 93 368 140 356 186 C346 224 304 238 286 268 C277 283 276 296 276 318"
              fill="none" stroke="#2a1660" stroke-opacity=".35" stroke-width="72" stroke-linecap="round" stroke-linejoin="round" transform="translate(4 8)"/>
        <path d="M178 186 C178 118 230 88 276 90 C338 93 368 140 356 186 C346 224 304 238 286 268 C277 283 276 296 276 318"
              fill="none" stroke="url(#q)" stroke-width="64" stroke-linecap="round" stroke-linejoin="round"/>
        <!-- the dot is a red peg -->
        <g transform="translate(278 410)">
          <circle r="46" fill="#ff5a4d"/><circle r="46" fill="url(#shine)"/><circle r="46" fill="url(#shade)"/>
          <path d="M0 -17 L16 11 L-16 11 Z" fill="#000" fill-opacity=".38"/>
        </g>
      </g>
      <!-- two more pegs -->
      <g transform="translate(122 382)">
        <circle r="34" fill="#1fc8f0"/><circle r="34" fill="url(#shine)"/><circle r="34" fill="url(#shade)"/>
        <circle r="9" fill="#000" fill-opacity=".38"/>
      </g>
      <g transform="translate(398 344)">
        <circle r="30" fill="#2fd45a"/><circle r="30" fill="url(#shine)"/><circle r="30" fill="url(#shade)"/>
        <rect x="-9" y="-9" width="18" height="18" fill="#000" fill-opacity=".38"/>
      </g>
    </g>
  </g>
</svg>
